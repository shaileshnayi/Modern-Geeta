<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurukshetra: The Inner Battlefield | Virtual Gita</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amita:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #050505;
            --kurukshetra-red: #4a0404;
            --divine-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-light: #fdf8e1;
            --text-muted: #a39b82;
            --glass-bg: rgba(15, 12, 10, 0.75);
            --glass-border: rgba(212, 175, 55, 0.2);
            --tamas: #475569;
            --rajas: #991b1b;
            --sattva: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-void);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(74, 4, 4, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }

        /* --- Global App Header --- */
        .app-header {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .header-title-container { display: flex; align-items: center; justify-content: space-between; width: auto; }
        
        .app-header h1 {
            color: var(--divine-gold); font-family: 'Cinzel', serif; font-size: 1.5rem;
            letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px var(--gold-glow);
        }

        .mobile-nav-toggle { display: none; }

        .main-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .main-nav button {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 4px;
            cursor: pointer; font-family: 'Cinzel', serif; font-weight: 600; transition: all 0.4s ease;
        }
        .main-nav button.active, .main-nav button:hover {
            background: rgba(212, 175, 55, 0.1); color: var(--divine-gold);
            border-color: var(--divine-gold); box-shadow: 0 0 10px var(--gold-glow);
        }

        /* --- Layout Containers --- */
        .app-view { display: none; flex: 1; overflow: hidden; animation: fadeIn 0.6s ease; }
        .app-view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- GITA VIEW STYLES --- */
        .sidebar {
            width: 320px; background: var(--glass-bg); backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border); display: flex;
            flex-direction: column; overflow-y: auto; z-index: 100;
        }

        .sidebar-header-mobile { display: none; }

        .chapter-btn {
            padding: 15px 20px; background: none; border: none;
            border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-muted);
            text-align: left; cursor: pointer; font-family: 'Amita', serif; font-size: 1.1rem;
            display: flex; justify-content: space-between; transition: all 0.3s ease;
        }
        .chapter-btn:hover { background: rgba(212, 175, 55, 0.05); color: var(--text-light); padding-left: 25px; }
        .chapter-btn.active { 
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, transparent 100%);
            color: var(--divine-gold); border-left: 4px solid var(--divine-gold); 
        }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        
        .top-nav {
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10;
        }

        .mobile-menu-btn { display: none; }

        .verse-selector select {
            background: rgba(10, 10, 10, 0.8); color: var(--divine-gold);
            border: 1px solid var(--divine-gold); padding: 8px 15px; border-radius: 4px;
            font-size: 1rem; font-family: 'Poppins', sans-serif; outline: none; cursor: pointer;
        }

        /* Added 120px bottom margin to give breathing room at the bottom of the page (desktop) */
        .shloka-container {
            max-width: 900px; margin: 30px auto 120px auto; padding: 40px;
            background: var(--glass-bg); backdrop-filter: blur(20px); border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 0 1px var(--glass-border);
            text-align: center; position: relative; border-top: 2px solid rgba(212, 175, 55, 0.4);
        }

        .action-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; gap: 10px; }
        
        .sanskrit-text {
            font-family: 'Amita', serif; font-size: 2.2rem; color: var(--divine-gold);
            line-height: 1.6; margin-bottom: 25px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--divine-gold), transparent); margin: 30px 0; opacity: 0.4; }
        .hindi-translation { font-family: 'Amita', serif; font-size: 1.3rem; color: var(--text-light); line-height: 1.8; }
        
        .deep-dive-box {
            display: none; margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.4);
            border-radius: 8px; border-left: 3px solid var(--divine-gold); text-align: left;
            font-size: 0.95rem; color: var(--text-muted);
        }

        /* --- JOURNAL --- */
        .journal-section { margin-top: 30px; text-align: left; width: 100%; }
        
        .journal-toggle-btn {
            width: 100%;
            background: rgba(10, 10, 10, 0.4);
            border: 1px dashed var(--glass-border);
            color: var(--divine-gold);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .journal-toggle-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--divine-gold);
        }

        .journal-content { display: none; margin-top: 15px; }
        .journal-content.open { display: block; animation: fadeIn 0.3s ease; }

        .journal-content textarea {
            width: 100%; height: 100px; background: rgba(0,0,0,0.5); color: var(--text-light);
            border: 1px solid var(--glass-border); border-radius: 8px; padding: 15px;
            font-family: 'Poppins', sans-serif; resize: vertical; outline: none; transition: 0.3s;
        }
        .journal-content textarea:focus { border-color: var(--divine-gold); box-shadow: 0 0 10px var(--gold-glow); }
        .journal-save-msg { color: var(--sattva); font-size: 0.8rem; margin-top: 5px; opacity: 0; transition: 0.3s; }

        /* --- NAVIGATION CONTROLS --- */
        .controls { 
            display: flex; justify-content: space-between; gap: 10px; 
            margin-top: 30px; margin-bottom: 20px;
            width: 100%; 
        }
        
        .btn {
            flex: 1; 
            padding: 12px 10px; background: rgba(10, 10, 10, 0.6); color: var(--divine-gold);
            border: 1px solid var(--divine-gold); border-radius: 4px; cursor: pointer;
            font-size: 0.85rem; font-family: 'Cinzel', serif; font-weight: 600; text-transform: uppercase;
            transition: all 0.3s ease; box-shadow: 0 0 10px rgba(0,0,0,0.3); text-align: center;
        }
        .btn:hover:not(:disabled) { background: var(--divine-gold); color: var(--bg-void); box-shadow: 0 0 15px var(--gold-glow); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--text-muted); color: var(--text-muted); }
        
        .btn-icon { flex: none; padding: 8px 12px; font-size: 1.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* --- ASTRAS (BOOKMARKS) SIDEBAR --- */
        .astras-panel {
            position: fixed; top: 0; right: -400px; width: 350px; height: 100vh;
            background: rgba(15, 12, 10, 0.95); backdrop-filter: blur(20px);
            border-left: 1px solid var(--divine-gold); z-index: 100; transition: 0.4s ease;
            display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        .astras-panel.open { right: 0; }
        .astras-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .astras-header h2 { color: var(--divine-gold); font-family: 'Cinzel', serif; font-size: 1.2rem; }
        .close-astras { background: none; border: none; color: var(--divine-gold); font-size: 1.5rem; cursor: pointer; }
        .astras-list { padding: 20px; overflow-y: auto; flex: 1; }
        .astra-card { background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); padding: 15px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .astra-card:hover { border-color: var(--divine-gold); }
        .astra-card h4 { color: var(--divine-gold); margin-bottom: 5px; font-family: 'Amita', serif; }
        .astra-card p { font-size: 0.85rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- PSYCHOLOGY VIEW STYLES --- */
        .psych-container { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 120px 20px; overflow-y: auto; }
        .psych-tabs { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .psych-tabs button { padding: 10px 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); border-radius: 4px; cursor: pointer; font-family: 'Cinzel', serif; font-weight: 600; transition: 0.3s; }
        .psych-tabs button.active { background: rgba(212, 175, 55, 0.15); color: var(--divine-gold); border-color: var(--divine-gold); }
        .psych-card { display: none; background: var(--glass-bg); padding: 40px; border-radius: 8px; width: 100%; max-width: 600px; border: 1px solid var(--glass-border); border-top: 2px solid var(--divine-gold); }
        .psych-card.active { display: block; animation: fadeIn 0.5s ease; }
        .psych-card h2 { color: var(--divine-gold); margin-bottom: 10px; font-family: 'Cinzel', serif; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 10px; color: var(--text-light); }
        .form-group input[type="text"] { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: var(--divine-gold); outline: none; }
        .radio-option { display: block; margin-bottom: 10px; cursor: pointer; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 4px; }
        .timer-display { font-size: 4rem; font-family: 'Cinzel', serif; font-weight: 700; text-align: center; margin: 20px 0; color: var(--divine-gold); }
        .result-box { margin-top: 20px; padding: 20px; border-radius: 4px; background: rgba(0,0,0,0.6); display: none; border-left: 4px solid var(--divine-gold); }

        /* =========================================================
           MOBILE & TABLET RESPONSIVE OVERHAUL
           ========================================================= */
        @media (max-width: 950px) {
            .app-header { padding: 15px; flex-direction: column; align-items: stretch; gap: 0; }
            .header-title-container { width: 100%; }
            
            .mobile-nav-toggle { 
                display: block; background: transparent; border: 1px solid var(--divine-gold); 
                color: var(--divine-gold); padding: 8px 15px; border-radius: 4px; 
                font-family: 'Cinzel', serif; font-weight: 600; cursor: pointer;
            }

            .main-nav { display: none; flex-direction: column; width: 100%; margin-top: 15px; gap: 10px; }
            .main-nav.open { display: flex; }
            .main-nav button { width: 100%; padding: 12px; }
            
            .sidebar { 
                position: fixed; top: 0; left: -100%; width: 300px; height: 100vh; 
                transition: left 0.4s ease; box-shadow: 10px 0 30px rgba(0,0,0,0.9);
                background: rgba(15, 12, 10, 0.98); 
            }
            .sidebar.open { left: 0; }
            .sidebar-header-mobile {
                display: flex; justify-content: space-between; align-items: center;
                padding: 20px; border-bottom: 1px solid var(--glass-border);
            }
            .sidebar-header-mobile h2 { color: var(--divine-gold); font-family: 'Cinzel', serif; font-size: 1.1rem; }
            .close-sidebar-btn { background: none; border: none; color: var(--divine-gold); font-size: 1.8rem; cursor: pointer; }

            .main-content { width: 100%; }
            .mobile-menu-btn {
                display: flex; align-items: center; gap: 8px;
                background: rgba(212, 175, 55, 0.15); color: var(--divine-gold);
                border: 1px solid var(--divine-gold); padding: 8px 15px; border-radius: 4px;
                font-family: 'Cinzel', serif; font-weight: 600; cursor: pointer; font-size: 0.9rem;
            }

            .top-nav { flex-wrap: wrap; justify-content: space-between; gap: 15px; padding: 15px; position: relative; }
            #current-chapter-title { width: 100%; text-align: center; order: 3; font-size: 1.2rem !important; margin-top: 5px; }
            .mobile-menu-btn { order: 1; }
            .verse-selector { order: 2; }

            /* Added massive 150px bottom margin so there is plenty of space to scroll past the card */
            .shloka-container { margin: 15px 15px 150px 15px; padding: 25px 25px 35px 25px; }
            
            .sanskrit-text { font-size: 1.5rem; }
            .hindi-translation { font-size: 1.1rem; }
            
            .astras-panel { width: 100%; right: -100%; }
            .action-bar { justify-content: center; margin-bottom: 30px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-title-container">
            <div>
                <h1>Kurukshetra</h1>
                <span style="font-size: 0.8rem; color: var(--text-muted); letter-spacing: 2px;">The Inner Battlefield</span>
            </div>
            <button class="mobile-nav-toggle" onclick="toggleMainNavbar()">☰ Menu</button>
        </div>
        <div class="main-nav" id="main-navigation">
            <button id="nav-gita" class="active" onclick="switchAppView('gita'); closeMainNavbar();">Divine Song</button>
            <button id="nav-psych" onclick="switchAppView('psych'); closeMainNavbar();">Mind Arsenal</button>
            <button onclick="toggleAstras(); closeMainNavbar();" style="border-color: var(--divine-gold);">📜 My Astras</button>
        </div>
    </header>

    <!-- Astras Sidebar Panel -->
    <div id="astras-panel" class="astras-panel">
        <div class="astras-header">
            <h2>Saved Weapons (Astras)</h2>
            <button class="close-astras" onclick="toggleAstras()">×</button>
        </div>
        <div class="astras-list" id="astras-list"></div>
    </div>

    <!-- APP VIEW 1: VIRTUAL GITA -->
    <div id="view-gita" class="app-view active">
        
        <div class="sidebar" id="chapter-list">
            <div class="sidebar-header-mobile">
                <h2>अध्याय (Chapters)</h2>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">×</button>
            </div>
        </div>

        <div class="main-content">
            <div class="top-nav">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ अध्याय</button>
                <div class="verse-selector">
                    <select id="verse-dropdown" onchange="changeVerse(this.value)"></select>
                </div>
                <h2 id="current-chapter-title" style="font-family: 'Amita', serif; color: var(--divine-gold); font-size: 1.4rem;">लोड हो रहा है...</h2>
            </div>

            <div class="shloka-container">
                <div class="action-bar">
                    <button class="btn btn-icon" onclick="saveAstra()" title="Save as Astra (Bookmark)">⚔️</button>
                    <button class="btn btn-icon" onclick="toggleDeepDive()" title="Deep Dive (English Meaning)">👁️</button>
                    <button class="btn btn-icon" onclick="playAudio()" title="Listen to Shloka">🔊</button>
                </div>

                <div class="sanskrit-text" id="shloka-sanskrit"></div>
                <div class="hindi-translation" id="shloka-hindi"></div>
                
                <div class="deep-dive-box" id="deep-dive-box">
                    <strong style="color:var(--divine-gold)">Transliteration:</strong>
                    <p id="shloka-trans" style="margin-bottom: 10px;"></p>
                    <strong style="color:var(--divine-gold)">English Meaning:</strong>
                    <p id="shloka-eng"></p>
                </div>

                <div class="divider"></div>

                <div class="journal-section">
                    <button class="journal-toggle-btn" onclick="toggleJournal()">📝 Open Sarthi's Journal</button>
                    
                    <div id="journal-content" class="journal-content">
                        <textarea id="journal-input" placeholder="Reflect on this verse. How does it apply to your current battlefield?"></textarea>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <button class="btn" style="flex: 0; padding: 8px 20px; font-size: 0.8rem;" onclick="saveJournal()">Save Entry</button>
                            <span id="journal-save-msg" class="journal-save-msg">Entry Saved!</span>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn" id="btn-prev" onclick="prevVerse()">&#8592; पूर्व</button>
                    <button class="btn" onclick="loadRandomVerse()">दिव्य दृष्टि</button>
                    <button class="btn" id="btn-next" onclick="nextVerse()">आगे &#8594;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- APP VIEW 2: PSYCHOLOGY TOOLS -->
    <div id="view-psych" class="app-view">
        <div class="psych-container">
            <div class="psych-tabs">
                <button class="active" onclick="switchPsychTab('guna', this)">Guna Audit</button>
                <button onclick="switchPsychTab('nishkama', this)">Nishkama Focus</button>
                <button onclick="switchPsychTab('swadharma', this)">Swadharma Compass</button>
            </div>

            <div id="guna" class="psych-card active">
                <h2>The Three Gunas</h2>
                <div class="form-group">
                    <label>How did you wake up today?</label>
                    <label class="radio-option"><input type="radio" name="q1" value="tamas"> Overslept, heavy, groggy</label>
                    <label class="radio-option"><input type="radio" name="q1" value="rajas"> Stressed, checked phone instantly</label>
                    <label class="radio-option"><input type="radio" name="q1" value="sattva"> Rested, calm, intentional</label>
                </div>
                <div class="form-group">
                    <label>How is your mind operating right now?</label>
                    <label class="radio-option"><input type="radio" name="q2" value="tamas"> Foggy, apathetic, procrastinating</label>
                    <label class="radio-option"><input type="radio" name="q2" value="rajas"> Racing, jumping between tasks</label>
                    <label class="radio-option"><input type="radio" name="q2" value="sattva"> Clear, focused on one thing</label>
                </div>
                <button class="btn" onclick="calculateGuna()" style="width: 100%;">Analyze State</button>
                <div id="guna-result" class="result-box"></div>
            </div>

            <div id="nishkama" class="psych-card">
                <h2>Nishkama Karma</h2>
                <p>Detach from the fruits of action. Focus purely on execution for 25 minutes.</p>
                <div class="timer-display" id="timer-display">25:00</div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn" onclick="startTimer()">Initiate Duty</button>
                    <button class="btn" onclick="resetTimer()" style="background: transparent; color: var(--text-muted); border-color: var(--text-muted);">Abandon</button>
                </div>
            </div>

            <div id="swadharma" class="psych-card">
                <h2>Swadharma Compass</h2>
                <div class="form-group">
                    <label>What craft puts you in a timeless flow state?</label>
                    <input type="text" id="passion" placeholder="e.g., Building, writing, analyzing...">
                </div>
                <div class="form-group">
                    <label>What chaos in the world do you feel called to fix?</label>
                    <input type="text" id="duty" placeholder="e.g., Ignorance, poor systems...">
                </div>
                <button class="btn" onclick="generateDharma()" style="width: 100%;">Reveal Dharma</button>
                <div id="dharma-result" class="result-box"></div>
            </div>
        </div>
    </div>

    <script>
        const chaptersData = [
            { id: 1, name: "अध्याय 1: अर्जुनविषादयोग", verses: 47 }, { id: 2, name: "अध्याय 2: सांख्ययोग", verses: 72 },
            { id: 3, name: "अध्याय 3: कर्मयोग", verses: 43 }, { id: 4, name: "अध्याय 4: ज्ञानकर्मसंन्यासयोग", verses: 42 },
            { id: 5, name: "अध्याय 5: कर्मसंन्यासयोग", verses: 29 }, { id: 6, name: "अध्याय 6: आत्मसंयमयोग", verses: 47 },
            { id: 7, name: "अध्याय 7: ज्ञानविज्ञानयोग", verses: 30 }, { id: 8, name: "अध्याय 8: अक्षरब्रह्मयोग", verses: 28 },
            { id: 9, name: "अध्याय 9: राजविद्याराजगुह्ययोग", verses: 34 }, { id: 10, name: "अध्याय 10: विभूतियोग", verses: 42 },
            { id: 11, name: "अध्याय 11: विश्वरूपदर्शनयोग", verses: 55 }, { id: 12, name: "अध्याय 12: भक्तियोग", verses: 20 },
            { id: 13, name: "अध्याय 13: क्षेत्रक्षेत्रज्ञविभागयोग", verses: 34 }, { id: 14, name: "अध्याय 14: गुणत्रयविभागयोग", verses: 27 },
            { id: 15, name: "अध्याय 15: पुरुषोत्तमयोग", verses: 20 }, { id: 16, name: "अध्याय 16: दैवासुरसम्पद्विभागयोग", verses: 24 },
            { id: 17, name: "अध्याय 17: श्रद्धात्रयविभागयोग", verses: 28 }, { id: 18, name: "अध्याय 18: मोक्षसंन्यासयोग", verses: 78 }
        ];

        let currentChapterId = 1, currentVerseNum = 1; 
        let currentVerseData = null; 
        let astras = JSON.parse(localStorage.getItem('gita-astras')) || [];
        let currentAudio = null;

        function switchAppView(view) {
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('#main-navigation button').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            document.getElementById(`nav-${view}`).classList.add('active');
        }

        function toggleMainNavbar() { document.getElementById('main-navigation').classList.toggle('open'); }
        function closeMainNavbar() { if(window.innerWidth <= 950) { document.getElementById('main-navigation').classList.remove('open'); } }
        function toggleSidebar() { document.getElementById('chapter-list').classList.toggle('open'); }

        function initGita() {
            const list = document.getElementById('chapter-list');
            chaptersData.forEach(chapter => {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn'; btn.id = `chap-btn-${chapter.id}`;
                btn.innerHTML = `${chapter.name} <span>&#8250;</span>`;
                btn.onclick = () => loadChapter(chapter.id);
                list.appendChild(btn);
            });
            loadChapter(1);
            renderAstras();
        }

        function loadChapter(chapterId) {
            document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`chap-btn-${chapterId}`).classList.add('active');
            currentChapterId = chapterId; currentVerseNum = 1;
            
            const chapter = chaptersData.find(c => c.id === chapterId);
            document.getElementById('current-chapter-title').innerText = chapter.name;
            const dropdown = document.getElementById('verse-dropdown');
            dropdown.innerHTML = '';
            for (let i = 1; i <= chapter.verses; i++) {
                const option = document.createElement('option');
                option.value = i; option.text = `श्लोक ${i}`; dropdown.appendChild(option);
            }
            fetchAndRenderVerse();

            if(window.innerWidth <= 950) { document.getElementById('chapter-list').classList.remove('open'); }
        }

        async function fetchAndRenderVerse() {
            document.getElementById('shloka-sanskrit').innerHTML = "ज्ञान जाग्रत हो रहा है... (Loading...)";
            document.getElementById('shloka-hindi').innerHTML = "";
            document.getElementById('verse-dropdown').value = currentVerseNum;
            document.getElementById('deep-dive-box').style.display = 'none';
            updateButtons(); loadJournal();

            try {
                const response = await fetch(`https://vedicscriptures.github.io/slok/${currentChapterId}/${currentVerseNum}`);
                if (!response.ok) throw new Error("API failed");
                currentVerseData = await response.json();
                
                document.getElementById('shloka-sanskrit').innerHTML = currentVerseData.slok.replace(/\n/g, '<br>');
                
                let hindiText = "अनुवाद उपलब्ध नहीं है।";
                if (currentVerseData.rams && currentVerseData.rams.ht) hindiText = currentVerseData.rams.ht;
                else if (currentVerseData.tej && currentVerseData.tej.ht) hindiText = currentVerseData.tej.ht;
                document.getElementById('shloka-hindi').innerHTML = hindiText;

                document.getElementById('shloka-trans').innerText = currentVerseData.translit || "Not available";
                let engText = currentVerseData.siva ? currentVerseData.siva.et : (currentVerseData.tej ? currentVerseData.tej.et : "Not available");
                document.getElementById('shloka-eng').innerText = engText;

            } catch (error) {
                document.getElementById('shloka-sanskrit').innerHTML = "त्रुटि (Error)";
                document.getElementById('shloka-hindi').innerHTML = "नेटवर्क बाधा।";
            }
        }

        function changeVerse(v) { currentVerseNum = parseInt(v); fetchAndRenderVerse(); }
        function prevVerse() { if (currentVerseNum > 1) { currentVerseNum--; fetchAndRenderVerse(); } }
        function nextVerse() {
            const ch = chaptersData.find(c => c.id === currentChapterId);
            if (currentVerseNum < ch.verses) { currentVerseNum++; fetchAndRenderVerse(); }
        }
        function updateButtons() {
            const ch = chaptersData.find(c => c.id === currentChapterId);
            document.getElementById('btn-prev').disabled = (currentVerseNum === 1);
            document.getElementById('btn-next').disabled = (currentVerseNum === ch.verses);
        }
        function loadRandomVerse() {
            const ch = chaptersData[Math.floor(Math.random() * chaptersData.length)];
            currentChapterId = ch.id; currentVerseNum = Math.floor(Math.random() * ch.verses) + 1;
            loadChapter(currentChapterId); document.getElementById('verse-dropdown').value = currentVerseNum;
            fetchAndRenderVerse();
        }

        function playAudio() {
            if(currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
            const audioUrl = `https://your-server.com/audio/ch${currentChapterId}_v${currentVerseNum}.mp3`;
            currentAudio = new Audio(audioUrl);
            currentAudio.play().catch(e => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    let text = document.getElementById('shloka-sanskrit').innerText;
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'hi-IN'; utterance.rate = 0.8; 
                    window.speechSynthesis.speak(utterance);
                } else { alert("Browser does not support TTS."); }
            });
        }

        function toggleDeepDive() {
            const box = document.getElementById('deep-dive-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function toggleJournal() {
            const content = document.getElementById('journal-content');
            const btn = document.querySelector('.journal-toggle-btn');
            content.classList.toggle('open');
            if (content.classList.contains('open')) {
                btn.innerHTML = '📝 Close Journal';
            } else {
                const entry = localStorage.getItem(`gita-journal-${currentChapterId}-${currentVerseNum}`);
                btn.innerHTML = entry ? '📝 View Saved Journal' : '📝 Open Sarthi\'s Journal';
            }
        }

        function loadJournal() {
            const entry = localStorage.getItem(`gita-journal-${currentChapterId}-${currentVerseNum}`);
            document.getElementById('journal-input').value = entry || "";
            const content = document.getElementById('journal-content');
            const btn = document.querySelector('.journal-toggle-btn');
            content.classList.remove('open');
            if (entry) {
                btn.innerHTML = '📝 View Saved Journal';
                btn.style.border = '1px solid var(--divine-gold)';
                btn.style.background = 'rgba(212, 175, 55, 0.15)';
            } else {
                btn.innerHTML = '📝 Open Sarthi\'s Journal';
                btn.style.border = '1px dashed var(--glass-border)';
                btn.style.background = 'rgba(10, 10, 10, 0.4)';
            }
        }

        function saveJournal() {
            const text = document.getElementById('journal-input').value;
            localStorage.setItem(`gita-journal-${currentChapterId}-${currentVerseNum}`, text);
            const msg = document.getElementById('journal-save-msg');
            msg.style.opacity = 1; setTimeout(() => msg.style.opacity = 0, 2000);
            const btn = document.querySelector('.journal-toggle-btn');
            btn.style.border = '1px solid var(--divine-gold)';
            btn.style.background = 'rgba(212, 175, 55, 0.15)';
        }

        function toggleAstras() { document.getElementById('astras-panel').classList.toggle('open'); }

        function saveAstra() {
            const text = document.getElementById('shloka-hindi').innerText;
            const exists = astras.find(a => a.ch === currentChapterId && a.v === currentVerseNum);
            if(!exists) {
                astras.push({ ch: currentChapterId, v: currentVerseNum, text: text });
                localStorage.setItem('gita-astras', JSON.stringify(astras));
                renderAstras(); alert(`Chapter ${currentChapterId}, Verse ${currentVerseNum} added to your Armory!`);
            } else { alert("This Astra is already in your Armory."); }
        }

        function renderAstras() {
            const list = document.getElementById('astras-list'); list.innerHTML = '';
            astras.forEach((a) => {
                const card = document.createElement('div'); card.className = 'astra-card';
                card.innerHTML = `<h4>Ch ${a.ch}, Verse ${a.v}</h4><p>${a.text}</p>`;
                card.onclick = () => { loadChapter(a.ch); changeVerse(a.v); toggleAstras(); };
                list.appendChild(card);
            });
            if(astras.length === 0) list.innerHTML = "<p style='color:var(--text-muted);'>Your armory is empty.</p>";
        }

        function switchPsychTab(tabId, btn) {
            document.querySelectorAll('.psych-card').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.psych-tabs button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active'); btn.classList.add('active');
        }

        function calculateGuna() {
            let t=0, r=0, s=0;
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            if(!q1 || !q2) return alert("Answer all questions.");
            [q1.value, q2.value].forEach(v => { if(v==='tamas') t++; if(v==='rajas') r++; if(v==='sattva') s++; });
            
            let res = document.getElementById('guna-result'); res.style.display = 'block';
            if(s >= t && s >= r) { res.innerHTML = "<strong style='color:var(--sattva)'>Sattvic Dominance</strong><br>Mind is clear."; res.style.borderLeftColor = 'var(--sattva)'; }
            else if(r > t) { res.innerHTML = "<strong style='color:var(--rajas)'>Rajasic Dominance</strong><br>Restless. Do deep breathing."; res.style.borderLeftColor = 'var(--rajas)'; }
            else { res.innerHTML = "<strong style='color:var(--tamas)'>Tamasic Dominance</strong><br>Clouded. Take action instantly."; res.style.borderLeftColor = 'var(--tamas)'; }
        }

        let timerInt; let timeLeft = 1500;
        function updateDisplay() { let m = Math.floor(timeLeft/60); let s = timeLeft%60; document.getElementById('timer-display').innerText = `${m}:${s<10?'0':''}${s}`; }
        function startTimer() { clearInterval(timerInt); timerInt = setInterval(() => { if(timeLeft<=0){ clearInterval(timerInt); alert("Duty complete."); } else { timeLeft--; updateDisplay(); } }, 1000); }
        function resetTimer() { clearInterval(timerInt); timeLeft = 1500; updateDisplay(); }

        function generateDharma() {
            const p = document.getElementById('passion').value; const d = document.getElementById('duty').value;
            if(!p || !d) return alert("Fill all fields.");
            let res = document.getElementById('dharma-result'); res.style.display = 'block';
            res.innerHTML = `Fight <strong>${d}</strong> using your inclination for <strong>${p}</strong>.<br><br><em style="color:var(--divine-gold)">Strike without attachment to the outcome.</em>`;
        }

        window.onload = initGita;
    </script>
</body>
</html>
